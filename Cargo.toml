[package]
name = "xvw"
version = "0.1.0"
edition = "2024"
description = "A fast, GPU-accelerated binary & hex editor built with GPUI and Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/funap/xvw"
homepage = "https://github.com/funap/xvw"
keywords = ["hex-editor", "binary", "gpui", "kaitai-struct", "reverse-engineering"]
categories = ["development-tools", "gui"]

[dependencies]
dirs = "6.0.0"
gpui = "0.2.2"
gpui-component = "0.5.1"
rust-embed = "8.12.0"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["full"] }
gpui_util = "0.2"
autocorrect = "2.14.2"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.2"
serde_json = "1.0.151"
toml = "1.1.4"
bstr = "1.13.1"
serde_yaml = "0.9"
memmap2 = "0.9.11"
flate2 = "1.1.9"
image = "0.25.10"
sha2 = "0.11.0"
encoding_rs = "0.8.35"

[profile.test]
# Keep test builds fast enough for IDE test-runner timeouts. The tests cover
# deterministic core/layout logic and do not need optimized code or debug info.
opt-level = 0
debug = 0
