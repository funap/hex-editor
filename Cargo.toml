[package]
name = "xvw"
version = "0.3.1"
edition = "2024"
description = "A Rust-powered GUI hex editor built on Zed's GPUI framework."
readme = "README.md"
license = "MIT"
repository = "https://github.com/funap/xvw"
homepage = "https://github.com/funap/xvw"
keywords = ["hex-editor", "binary", "gpui", "kaitai-struct", "reverse-engineering"]
categories = ["development-tools", "gui"]

[dependencies]
dirs = "7.0.0"
gpui = { package = "gpui-pre", version = "0.3.1" }
gpui-kit = "0.6.0"
rust-embed = "8.12.0"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["full"] }
autocorrect = "2.14.2"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.2"
serde_json = "1.0.151"
toml = "1.1.5"
bstr = "1.13.1"
serde_yaml = "0.9"
memmap2 = "0.9.11"
flate2 = "1.1.10"
image = "0.25.10"
sha2 = "0.11.0"
encoding_rs = "0.8.35"

[profile.test]
# Keep test builds fast enough for IDE test-runner timeouts. The tests cover
# deterministic core/layout logic and do not need optimized code or debug info.
opt-level = 0
debug = 0

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
