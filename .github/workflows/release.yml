name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          VERSION_RAW="${{ inputs.tag_name }}"
          VERSION="${VERSION_RAW#v}"

          case "${{ matrix.target }}" in
            x86_64*)
              DEB_ARCH="amd64"
              RPM_ARCH="x86_64"
              ;;
            aarch64*)
              DEB_ARCH="arm64"
              RPM_ARCH="aarch64"
              ;;
            *)
              DEB_ARCH="amd64"
              RPM_ARCH="x86_64"
              ;;
          esac

          # 1. Debian / Ubuntu package (.deb)
          DEB_DIR="xvw_${VERSION}_linux_${DEB_ARCH}"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "${DEB_DIR}/usr/share/pixmaps"
          mkdir -p "${DEB_DIR}/usr/share/doc/xvw"

          cp "target/${{ matrix.target }}/release/xvw" "${DEB_DIR}/usr/bin/"
          chmod 755 "${DEB_DIR}/usr/bin/xvw"
          cp assets/linux/xvw.desktop "${DEB_DIR}/usr/share/applications/"
          cp assets/icons/xvw.svg "${DEB_DIR}/usr/share/icons/hicolor/scalable/apps/"
          cp assets/icons/xvw.svg "${DEB_DIR}/usr/share/pixmaps/"
          [ -f README.md ] && cp README.md "${DEB_DIR}/usr/share/doc/xvw/"
          [ -f LICENSE ] && cp LICENSE "${DEB_DIR}/usr/share/doc/xvw/"

          {
            echo "Package: xvw"
            echo "Version: ${VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: ${DEB_ARCH}"
            echo "Maintainer: funap <https://github.com/funap/xvw>"
            echo "Description: A fast, GPU-accelerated binary & hex editor built with GPUI and Rust"
          } > "${DEB_DIR}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${DEB_DIR}" "dist/xvw_${VERSION}_linux_${DEB_ARCH}.deb"
          rm -rf "${DEB_DIR}"

          # 2. Fedora / RHEL package (.rpm)
          RPM_ROOT="${RUNNER_TEMP}/rpmbuild"
          mkdir -p "${RPM_ROOT}"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          BUILDROOT="${RPM_ROOT}/BUILDROOT/xvw-${VERSION}-1.linux.${RPM_ARCH}"
          mkdir -p "${BUILDROOT}/usr/bin"
          mkdir -p "${BUILDROOT}/usr/share/applications"
          mkdir -p "${BUILDROOT}/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "${BUILDROOT}/usr/share/pixmaps"
          mkdir -p "${BUILDROOT}/usr/share/doc/xvw"

          cp "target/${{ matrix.target }}/release/xvw" "${BUILDROOT}/usr/bin/"
          chmod 755 "${BUILDROOT}/usr/bin/xvw"
          cp assets/linux/xvw.desktop "${BUILDROOT}/usr/share/applications/"
          cp assets/icons/xvw.svg "${BUILDROOT}/usr/share/icons/hicolor/scalable/apps/"
          cp assets/icons/xvw.svg "${BUILDROOT}/usr/share/pixmaps/"
          [ -f README.md ] && cp README.md "${BUILDROOT}/usr/share/doc/xvw/"
          [ -f LICENSE ] && cp LICENSE "${BUILDROOT}/usr/share/doc/xvw/"

          {
            echo "%global _build_id_links none"
            echo "%global debug_package %{nil}"
            echo "%global __os_install_post %{nil}"
            echo ""
            echo "Name:           xvw"
            echo "Version:        ${VERSION}"
            echo "Release:        1.linux"
            echo "Summary:        A fast, GPU-accelerated binary & hex editor built with GPUI and Rust"
            echo "License:        MIT"
            echo "URL:            https://github.com/funap/xvw"
            echo ""
            echo "%description"
            echo "A fast, GPU-accelerated binary & hex editor built with GPUI and Rust."
            echo ""
            echo "%files"
            echo "/usr/bin/xvw"
            echo "/usr/share/applications/xvw.desktop"
            echo "/usr/share/icons/hicolor/scalable/apps/xvw.svg"
            echo "/usr/share/pixmaps/xvw.svg"
            echo "/usr/share/doc/xvw/README.md"
            echo "/usr/share/doc/xvw/LICENSE"
            echo ""
            echo "%changelog"
          } > "${RPM_ROOT}/SPECS/xvw.spec"

          rpmbuild -bb --target "${RPM_ARCH}" --define "_topdir ${RPM_ROOT}" --buildroot="${BUILDROOT}" "${RPM_ROOT}/SPECS/xvw.spec"
          cp "${RPM_ROOT}/RPMS/${RPM_ARCH}/"*.rpm "dist/"
          rm -rf "${RPM_ROOT}"

      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          VERSION_RAW="${{ inputs.tag_name }}"
          VERSION="${VERSION_RAW#v}"

          # 1. Build .app bundle
          APP_BUNDLE="xvw.app"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources"

          cp "target/${{ matrix.target }}/release/xvw" "${APP_BUNDLE}/Contents/MacOS/"
          chmod +x "${APP_BUNDLE}/Contents/MacOS/xvw"

          sed "s/__VERSION__/${VERSION}/g" assets/macos/Info.plist.in > "${APP_BUNDLE}/Contents/Info.plist"

          if [ -f assets/icons/xvw.icns ]; then
            cp assets/icons/xvw.icns "${APP_BUNDLE}/Contents/Resources/xvw.icns"
          fi

          # Ad-hoc code sign .app bundle (required for Apple Silicon execution)
          codesign --force --deep -s - "${APP_BUNDLE}"

          # 2. Build .dmg disk image
          DMG_STAGING="dmg_staging"
          mkdir -p "${DMG_STAGING}"
          cp -R "${APP_BUNDLE}" "${DMG_STAGING}/"
          ln -s /Applications "${DMG_STAGING}/Applications"

          ARCHIVE_NAME="xvw-${{ inputs.tag_name }}-${{ matrix.target }}"
          hdiutil create \
            -volname "xvw" \
            -srcfolder "${DMG_STAGING}" \
            -ov \
            -format UDZO \
            "dist/${ARCHIVE_NAME}.dmg"

          codesign --force -s - "dist/${ARCHIVE_NAME}.dmg"

          rm -rf "${DMG_STAGING}" "${APP_BUNDLE}"

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE_NAME="xvw-${{ inputs.tag_name }}-${{ matrix.target }}"
          DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${DIR}"
          cp "target/${{ matrix.target }}/release/xvw.exe" "${DIR}/"
          [ -f README.md ] && cp README.md "${DIR}/"
          [ -f LICENSE ] && cp LICENSE "${DIR}/"
          
          cd dist
          7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Release ${{ inputs.tag_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.rpm
